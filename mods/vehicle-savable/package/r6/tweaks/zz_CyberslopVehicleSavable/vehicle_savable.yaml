# Cyberslop Vehicle Savable 1.0.0 (penicius-code, 2026-11-08)
# Every vanilla player vehicle (Vehicle.*_player, 2.31 player_vehicles.tweak) has savable = true.
# These ownable custom vehicles copy a vanilla TRAFFIC record with $base, which has no savable flag,
# so the car is never written into a save. Loading a save made while driving one put V on the roof
# (Caliburn Legacy, 2026-11-08). This sets the flag the vanilla player versions have.
# Only records in Vehicle.vehicle_list (player-ownable) are listed. Remove this folder to revert.

# Standalone - Rayfield Caliburn Legacy (24222), $base Vehicle.v_sport1_rayfield_caliburn
Vehicle.rayfield_caliburn_legacy.savable: true

# Apollo Scout Tactical (boneill / hausvonsin), $base Vehicle.v_sportbike3_brennan_apollo
Vehicle.militech_apollo_tactical.savable: true

# Honda NSX Liberty Walk (sdh0), $base Vehicle.v_sport2_porsche_911turbo
Vehicle.nsx_lb_base.savable: true

# SDH0 Color Pack car, $base Vehicle.v_sport2_porsche_911turbo
Vehicle.color_pack_base.savable: true

